# KinShop — kinshop.aenews.digital (2026-09-12)
# Plateforme boutiques WhatsApp RDC — /opt/KINSHOP (PM2: kinshop, port 3310)
map $http_upgrade $kinshop_connection_upgrade {
    default upgrade;
    ""      "";
}
server {
    listen 80;
    listen [::]:80;
    server_name kinshop.aenews.digital;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kinshop.aenews.digital;

    ssl_certificate /etc/letsencrypt/live/kinshop.aenews.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kinshop.aenews.digital/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;

    # Vague 2 — CSP Report-Only : observation avant durcissement progressif.
    # Les navigateurs rapportent les violations vers /api/csp-report (logs PM2 throttlés).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.chariow.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report;" always;

    access_log /var/log/nginx/kinshop-access.log;
    error_log  /var/log/nginx/kinshop-error.log;

    client_max_body_size 50m;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3310;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /sw.js {
        proxy_pass http://127.0.0.1:3310;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /manifest.webmanifest {
        proxy_pass http://127.0.0.1:3310;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /favicon.ico {
        proxy_pass http://127.0.0.1:3310;
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://127.0.0.1:3310;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kinshop_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # C2 vague 1 : XFF écrasé par $remote_addr (real_ip Cloudflare) — l'IP entrante
        # n'est plus propageable : premier élément non falsifiable pour le rate-limit applicatif.
        proxy_set_header X-Forwarded-For $remote_addr;
        # C2 renfort : CF-Connecting-IP écrasé avec la valeur VALIDÉE par real_ip.
        # Une requête hors chemin Cloudflare (DNS direct, loopback) ne peut plus
        # tromper l'app avec un CF-Connecting-IP forgé.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
